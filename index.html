<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichário de Receitas</title>
<meta name="description" content="Seu livro de receitas no celular, com cópia no Google Drive.">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("fichario-tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Receitas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-->
<header class="top">
  <div class="wrap">
    <div class="titlebar">
      <div class="title-left">
        <button class="iconbtn back" id="back" aria-label="Voltar para as categorias" hidden><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></button>
        <div>
        <h1 id="view-title">Receitas</h1>
        <p class="sub" id="count"></p>
        </div>
        <button class="iconbtn plain" id="cat-edit" aria-label="Editar categoria" hidden><svg class="i" aria-hidden="true"><use href="#i-edit"/></svg></button>
      </div>
      <button class="sync" id="sync" data-state="off" hidden></button>
    </div>
    <div class="search">
      <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Buscar receita ou ingrediente" autocomplete="off" enterkeyhint="search" aria-label="Buscar receita ou ingrediente">
      <button class="clear" id="q-clear" aria-label="Limpar busca" hidden><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="modes" id="modes" role="group" aria-label="Onde buscar" hidden>
      <button data-mode="all" aria-pressed="true">Tudo</button>
      <button data-mode="name" aria-pressed="false">Só nome</button>
      <button data-mode="have" aria-pressed="false">Tenho em casa</button>
    </div>
    <p class="hint" id="hint" hidden>Separe por vírgula, ex.: <b>ovo, banana, aveia</b>. Mostra o que dá para fazer com todos.</p>
    <div class="chips" id="catchips" role="group" aria-label="Filtrar por categoria"></div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="state"><h2>Abrindo o fichário…</h2></div>
</main>

<nav class="tabbar" aria-label="Navegação">
  <div class="in">
    <button class="tab" data-view="home" aria-current="page"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg>Início</button>
    <button class="tab" data-view="fav"><svg class="i" aria-hidden="true"><use href="#i-star"/></svg>Favoritas</button>
    <button class="fab" id="fab" aria-label="Nova receita"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
    <button class="tab" id="tab-search"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar</button>
    <button class="tab" id="tab-settings"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg>Ajustes</button>
  </div>
</nav>

<div id="layer"></div>

<!-- ícones (traço 2px, estilo Lucide) -->
